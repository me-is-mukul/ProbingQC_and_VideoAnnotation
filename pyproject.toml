[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probing-qc"
version = "0.2.0"
description = "Quality-control pipeline for GoPro probing videos: IMU extraction and video QC metrics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    # MediaPipe depends on the contrib build; also requiring opencv-python would install
    # two packages that overwrite each other's cv2 module.
    "opencv-contrib-python>=4.8",
    "mediapipe>=0.10.14",
    "requests>=2.28",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ipykernel", "matplotlib"]

[project.scripts]
probing-extract = "probing_qc.cli.extract:main"
probing-qc = "probing_qc.cli.qc:main"
probing-download = "probing_qc.cli.download:main"
probing-job = "probing_qc.cli.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs FFmpeg on PATH (generates a small synthetic video)",
]
