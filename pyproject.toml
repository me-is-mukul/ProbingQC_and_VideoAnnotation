[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probing-qc"
version = "0.1.0"
description = "Quality-control pipeline for GoPro probing videos: IMU extraction and video QC metrics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "requests>=2.28",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ipykernel", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
